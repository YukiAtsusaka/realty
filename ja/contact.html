<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="セキホーム不動産へのお問い合わせ。">
  <title>お問い合わせ | セキホーム不動産</title>
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="../assets/images/logo-seki.jpg" alt="Seki Home Realty"></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">メニュー <span></span></button>
    <nav id="site-nav" class="site-nav">
      <a href="team.html">チーム紹介</a>
      <a href="services.html">サービス</a>
      
      <a href="reviews.html">お客様の声</a>
      <a href="search.html">物件検索</a>
      <a class="nav-language" href="../index.html">English</a>
      <a class="button button-small" href="contact.html">お問い合わせ</a>
    </nav>
  </header>
  <main>
    <section class="page-hero">
      <p class="eyebrow">お問い合わせ</p>
      <h1>まずはお気軽に<br>ご相談ください。</h1>
      <p>現在の状況やご希望をお聞かせください。私たちがお手伝いします。</p>
    </section>
    <section class="section">
      <div class="contact-layout">
        <div class="contact-details">
          <p class="eyebrow">セキホーム不動産 LLC</p>
          <h2>ご都合のよいときに<br>ご相談ください。</h2>
          <p>ヒューストン広域とその周辺地域に対応しています。</p>
        </div>
        <form class="contact-form" action="https://formsubmit.co/chinari@sekihomerealty.com" method="POST">
          <input type="hidden" name="_subject" value="セキホーム不動産ウェブサイトからの新しいお問い合わせ">
          <input type="hidden" name="_next" value="https://yukiatsusaka.github.io/thank-you.html">
          <input type="hidden" name="_autoresponse" value="セキホーム不動産へお問い合わせいただき、ありがとうございます。メッセージを受け取りました。担当者よりまもなくご返信いたします。以下にお問い合わせ内容の控えをお送りします。">
          <input type="text" name="_honey" style="position:absolute;left:-9999px" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div><label for="name">お名前</label><input id="name" name="name" autocomplete="name" required></div>
          <div><label for="email">メールアドレス</label><input id="email" type="email" name="email" autocomplete="email" required></div>
          <div><label for="message">ご相談内容</label><textarea id="message" name="message" required></textarea></div>
          <button class="button" type="submit">お問い合わせを送信する <span>→</span></button>
          <p class="notice">メッセージはセキホーム不動産へ直接送信されます。お問い合わせ内容の控えをメールでお送りします。</p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <a class="brand brand-light" href="index.html"><img src="../assets/images/logo-seki.jpg" alt="Seki Home Realty"></a>
    <div><p>ヒューストン広域の不動産を、あなたらしく。</p></div>
    <div class="footer-links"><a href="team.html">チーム紹介</a><a href="services.html">サービス</a><a href="reviews.html">お客様の声</a><a href="search.html">物件検索</a><a href="contact.html">お問い合わせ</a></div>
    <small>© <span data-year></span> Seki Home Realty LLC</small>
  </footer>
  <script src="../assets/js/site.js"></script>
</body>
</html>
